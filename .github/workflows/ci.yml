name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04-arm
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          filters: |
            frontend:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.css'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'jest.config.*'
              - 'resources/**'
              - 'tests-ts/**'
              - '.github/workflows/**'
            backend:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - '.env.example'
              - 'phpunit.xml'
              - 'app/**'
              - 'bootstrap/**'
              - 'config/**'
              - 'database/**'
              - 'routes/**'
              - 'tests/**'
              - '.github/workflows/**'

  migrations:
    # Guards against editing a migration that has already run somewhere.
    # Laravel records applied migrations by filename, so amending one in place
    # is silently skipped on any database that already ran it — the amendment
    # lands on fresh installs only. That is how production ended up without
    # characters.ulid / is_linked while the deployed code required them.
    # Add new migrations instead; use the override label for a deliberate
    # amendment to a migration that has never been deployed.
    name: Migration amendments
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject in-place edits to existing migrations
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'migration-amend-ok') }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          # Anything other than an Added file under database/migrations is an
          # edit to a migration that may already be recorded as run.
          touched=$(git diff --name-status --diff-filter=MRD \
            "origin/${BASE_REF}...HEAD" -- database/migrations/ || true)
          if [ -n "$touched" ]; then
            echo "::error::This PR modifies migrations that already exist on ${BASE_REF}."
            echo "$touched"
            echo ""
            echo "Laravel tracks applied migrations by filename, so an in-place edit is"
            echo "SKIPPED on any database that already ran the original — including"
            echo "production. Add a new migration instead."
            echo ""
            echo "If the migration has genuinely never been deployed anywhere, add the"
            echo "'migration-amend-ok' label to this PR."
            exit 1
          fi
          echo "No existing migrations were modified."

  # Frontend and backend were one sequential job ("Changed-area checks"). On a PR
  # touching both areas that job ran ~31s of shared setup, then 20s of frontend
  # checks, then 32s of backend checks -- 90s, and the critical path. Split, each
  # half pays its own (smaller) setup and they overlap, so the pair finishes in
  # roughly the time the backend half alone used to take. The duplicated setup is
  # free here: this repository is public, so runner minutes are not billed and
  # latency is the only thing being optimised.
  frontend:
    name: Frontend checks
    needs: changes
    # Deliberately also runs for backend-only changes: `pnpm run build` is the
    # guard against a PHP change breaking the bundle (route/type generation
    # feeding TypeScript), which is why the build step below was already gated
    # this way. Only the type-check/lint/test trio is frontend-exclusive.
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 4
        run: pnpm install --frozen-lockfile

      # Vite reads .env itself (loadEnv); no PHP is involved in `vite build`, so
      # this job needs neither the PHP toolchain nor `artisan key:generate`.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Build frontend assets
        run: pnpm run build

      - name: Frontend checks
        if: needs.changes.outputs.frontend == 'true'
        timeout-minutes: 5
        run: |
          pnpm exec concurrently --kill-others-on-fail --names "tsc,lint,jest" \
            "pnpm run type-check" \
            "pnpm run lint" \
            "pnpm run test"

  backend:
    name: Backend checks (SQLite)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Verify PHP
        run: php --version

      # Keyed per job and per architecture. The two Composer-using jobs
      # previously shared the key `composer-<lock hash>` and run concurrently, so
      # they raced to create it: every run logged `Cache not found for input
      # keys` and then `Failed to save: Unable to reserve cache ... another job
      # may be creating this cache`, and the cache never restored. Distinct keys
      # let both save, and main's caches are then visible to every PR branch.
      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ runner.arch }}-checks-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ runner.arch }}-checks-

      - name: Install dependencies
        timeout-minutes: 4
        run: composer install --no-interaction --prefer-dist

      # No `Prepare Laravel environment` step: phpunit.xml supplies what the
      # suite needs, which the `sql` job below has always demonstrated by running
      # `composer test` without one.
      - name: Backend checks
        timeout-minutes: 8
        run: |
          ./vendor/bin/pint --test
          composer test

  sql:
    name: Backend tests (MariaDB 10.6)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    services:
      database:
        # Production runs 10.6.27-MariaDB on the cPanel host.
        image: mariadb:10.6
        env:
          MARIADB_DATABASE: vora_ci
          MARIADB_USER: vora_ci
          MARIADB_PASSWORD: vora_ci_password
          MARIADB_ROOT_PASSWORD: vora_ci_root_password
        ports:
          - 3306:3306
        # The container is usually accepting connections in a few seconds, but a
        # 10s poll interval means the first probe cannot succeed before 10s and a
        # single miss costs another 10s -- which is where ~21s of "Initialize
        # containers" went. Poll fast after a short grace period instead. The
        # ceiling is still generous: 5s + 10 x 3s = 35s, up from 5 x 10s = 50s
        # only in the sense that it fails sooner on a genuinely broken container.
        options: >-
          --health-cmd="mariadb-admin ping --host=localhost --user=root --password=vora_ci_root_password"
          --health-start-period=5s
          --health-interval=3s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: 'true'
      VORA_MARIADB_CI: 'true'
      DB_URL: ''
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vora_ci
      DB_USERNAME: vora_ci
      DB_PASSWORD: vora_ci_password

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ runner.arch }}-sql-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ runner.arch }}-sql-

      - name: Install dependencies
        timeout-minutes: 4
        run: composer install --no-interaction --prefer-dist

      # Pint is formatting-only and database-independent, and the `test` job
      # already runs it -- that job's condition (frontend || backend) is a
      # superset of this one's (backend), so it always runs when this job does.
      # The MariaDB suite itself is deliberately kept: per TESTING.AGENTS.md it
      # is additional coverage against the engine production runs, not a
      # replacement for the SQLite pass in `test`.
      - name: Backend tests
        timeout-minutes: 10
        run: composer test

  result:
    name: CI result
    needs: [changes, frontend, backend, migrations, sql]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.result }}" == "failure" || "${{ needs.changes.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" == "failure" || "${{ needs.frontend.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "failure" || "${{ needs.backend.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.migrations.result }}" == "failure" || "${{ needs.migrations.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.sql.result }}" == "failure" || "${{ needs.sql.result }}" == "cancelled" ]]; then
            exit 1
          fi
          echo "Required checks passed or no code paths changed."
