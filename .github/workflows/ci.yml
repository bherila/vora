name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04-arm
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          filters: |
            frontend:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.css'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'jest.config.*'
              - 'resources/**'
              - 'tests-ts/**'
              - '.github/workflows/**'
            backend:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - '.env.example'
              - 'phpunit.xml'
              - 'app/**'
              - 'bootstrap/**'
              - 'config/**'
              - 'database/**'
              - 'routes/**'
              - 'tests/**'
              - '.github/workflows/**'

  migrations:
    # Guards against editing a migration that has already run somewhere.
    # Laravel records applied migrations by filename, so amending one in place
    # is silently skipped on any database that already ran it — the amendment
    # lands on fresh installs only. That is how production ended up without
    # characters.ulid / is_linked while the deployed code required them.
    # Add new migrations instead; use the override label for a deliberate
    # amendment to a migration that has never been deployed.
    name: Migration amendments
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject in-place edits to existing migrations
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'migration-amend-ok') }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          # Anything other than an Added file under database/migrations is an
          # edit to a migration that may already be recorded as run.
          touched=$(git diff --name-status --diff-filter=MRD \
            "origin/${BASE_REF}...HEAD" -- database/migrations/ || true)
          if [ -n "$touched" ]; then
            echo "::error::This PR modifies migrations that already exist on ${BASE_REF}."
            echo "$touched"
            echo ""
            echo "Laravel tracks applied migrations by filename, so an in-place edit is"
            echo "SKIPPED on any database that already ran the original — including"
            echo "production. Add a new migration instead."
            echo ""
            echo "If the migration has genuinely never been deployed anywhere, add the"
            echo "'migration-amend-ok' label to this PR."
            exit 1
          fi
          echo "No existing migrations were modified."

  test:
    name: Changed-area checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Verify PHP
        run: php --version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        timeout-minutes: 4
        run: |
          composer install --no-interaction --prefer-dist &
          composer_pid=$!
          pnpm install --frozen-lockfile &
          pnpm_pid=$!
          wait "$composer_pid"; composer_status=$?
          wait "$pnpm_pid"; pnpm_status=$?
          test "$composer_status" -eq 0 -a "$pnpm_status" -eq 0

      - name: Prepare Laravel environment
        run: cp .env.example .env && php artisan key:generate --no-interaction --force

      - name: Build frontend assets
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
        run: pnpm run build

      - name: Frontend checks
        if: needs.changes.outputs.frontend == 'true'
        timeout-minutes: 5
        run: |
          pnpm exec concurrently --kill-others-on-fail --names "tsc,lint,jest" \
            "pnpm run type-check" \
            "pnpm run lint" \
            "pnpm run test"

      - name: Backend checks
        if: needs.changes.outputs.backend == 'true'
        timeout-minutes: 8
        run: |
          ./vendor/bin/pint --test
          composer test

  sql:
    name: Backend tests (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: MySQL 8.0
            image: mysql:8.0
            driver: mysql
            health_command: mysqladmin ping --host=localhost --user=root --password=vora_ci_root_password
          - label: MariaDB 10.11
            image: mariadb:10.11
            driver: mariadb
            health_command: mariadb-admin ping --host=localhost --user=root --password=vora_ci_root_password
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: vora_ci
          MYSQL_USER: vora_ci
          MYSQL_PASSWORD: vora_ci_password
          MYSQL_ROOT_PASSWORD: vora_ci_root_password
          MARIADB_DATABASE: vora_ci
          MARIADB_USER: vora_ci
          MARIADB_PASSWORD: vora_ci_password
          MARIADB_ROOT_PASSWORD: vora_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_command }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: 'true'
      VORA_MYSQL_CI: ${{ matrix.driver == 'mysql' }}
      VORA_MARIADB_CI: ${{ matrix.driver == 'mariadb' }}
      DB_URL: ''
      DB_CONNECTION: ${{ matrix.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vora_ci
      DB_USERNAME: vora_ci
      DB_PASSWORD: vora_ci_password

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        timeout-minutes: 4
        run: composer install --no-interaction --prefer-dist

      - name: Backend checks
        timeout-minutes: 10
        run: |
          ./vendor/bin/pint --test
          composer test

  result:
    name: CI result
    needs: [changes, test, migrations, sql]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.result }}" == "failure" || "${{ needs.changes.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.migrations.result }}" == "failure" || "${{ needs.migrations.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.sql.result }}" == "failure" || "${{ needs.sql.result }}" == "cancelled" ]]; then
            exit 1
          fi
          echo "Required checks passed or no code paths changed."
