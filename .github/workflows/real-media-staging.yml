name: Real media staging acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/real-media-staging.yml'
      - '.dockerignore'
      - 'docker/local/**'
      - 'tests/staging/**'
      - 'app/Csp/**'
      - 'app/Services/Library/**'
      - 'app/Services/Media/**'
      - 'app/Services/FileStorageService.php'
      - 'app/Services/UserAccountService.php'
      - 'app/Http/Controllers/Library*'
      - 'app/Http/Controllers/MediaController.php'
      - 'app/Http/Controllers/Admin/AdminMediaController.php'
      - 'app/Http/Controllers/Admin/AdminUserController.php'
      - 'app/Http/Requests/Library/**'
      - 'app/Http/Requests/Media/**'
      - 'app/Http/Requests/Admin/AdminUserUpdateRequest.php'
      - 'app/Models/Library*'
      - 'app/Models/Media.php'
      - 'app/Models/User.php'
      - 'app/Models/Concerns/**'
      - 'app/Enums/Media*'
      - 'app/Enums/Audience.php'
      - 'app/Policies/MediaPolicy.php'
      - 'resources/js/library/**'
      - 'resources/js/media/**'
      - 'resources/views/library/**'
      - 'database/migrations/**'
      - 'config/media.php'
      - 'config/filesystems.php'
      - 'routes/web.php'
      - 'routes/events.php'
      - 'config/instance.php'
      - 'app/Support/InstanceFeatures.php'
      - 'app/Services/Events/**'
      - 'app/Http/Controllers/Events/**'
      - 'resources/js/events/**'
      - 'resources/views/events/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-media:
    name: Docker direct/multipart uploads, HLS, quotas and retained saves
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [vora, event]
    env:
      LOCAL_STAGING_APP_PROFILE: ${{ matrix.profile }}
      LOCAL_STAGING_ACCEPTANCE: '1'
      ALLOW_DISPOSABLE_ACCOUNT_PURGE: '1'
      STAGING_APP_URL: http://127.0.0.1:18080
      STAGING_MAIL_URL: http://127.0.0.1:18025
      # Tiny real fixtures cover both upload transports without large videos.
      LOCAL_STAGING_MULTIPART_THRESHOLD_BYTES: '1024'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install browser runner and real-media fixture tools
        run: |
          pnpm install --frozen-lockfile
          # Ubuntu 24.04 runner images route Ubuntu sources through this list.
          # Avoid the Azure mirror that has stalled package downloads until the job deadline.
          grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          grep -Fq 'https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          # Persist bounds for both our APT commands and Playwright's dependency installer.
          sudo tee /etc/apt/apt.conf.d/zz-vora-real-media >/dev/null <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pnpm exec playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Sequential builds bound runner pressure. Each image has an independent
      # GitHub Actions layer cache, including the source-built local MinIO image.
      - name: Build normal application with production assets
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/local/Dockerfile
          target: app
          load: true
          tags: vora-local-staging-app:latest
          cache-from: type=gha,scope=vora-local-staging-app-amd64
          cache-to: type=gha,scope=vora-local-staging-app-amd64,mode=max

      - name: Build real FFmpeg transcoder
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/local/Dockerfile
          target: transcoder
          load: true
          tags: vora-local-staging-transcoder:latest
          cache-from: type=gha,scope=vora-local-staging-transcoder-amd64
          cache-to: type=gha,scope=vora-local-staging-transcoder-amd64,mode=max

      - name: Build isolated MinIO object store
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/local/Minio.Dockerfile
          load: true
          tags: vora-local-staging-minio:latest
          cache-from: type=gha,scope=vora-local-staging-minio-amd64
          cache-to: type=gha,scope=vora-local-staging-minio-amd64,mode=max

      - name: Start disposable loopback-only services
        run: docker compose -f docker/local/compose.yaml up -d --no-build

      - name: Explicitly initialize dedicated Docker staging SQLite
        run: docker compose -f docker/local/compose.yaml exec -T app sh docker/local/initialize.sh --initialize-sqlite

      - name: Wait for application, Mailpit and object storage
        run: |
          for endpoint in \
            http://127.0.0.1:18080/up \
            http://127.0.0.1:18080/login \
            http://127.0.0.1:18025/api/v1/messages \
            http://127.0.0.1:19000/minio/health/ready; do
            curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors --max-time 5 "$endpoint" > /dev/null
          done
          node tests/staging/check-startup.mjs

      - name: Run normal SMTP-authenticated real-media acceptance
        # Event runs the Library journey plus its own membership/retention journey.
        timeout-minutes: 14
        run: pnpm exec playwright test --config tests/staging/playwright.config.mjs

      - name: Collect disposable service diagnostics
        if: always()
        run: |
          mkdir -p tests/staging/artifacts/services
          docker compose -f docker/local/compose.yaml ps -a > tests/staging/artifacts/services/containers.txt 2>&1 || true
          docker compose -f docker/local/compose.yaml logs --no-color --tail 500 > tests/staging/artifacts/services/compose.log 2>&1 || true

      - name: Preserve acceptance reports, failure traces and service diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: real-media-staging-${{ matrix.profile }}
          path: tests/staging/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop idle services while retaining disposable volumes
        if: always()
        run: docker compose -f docker/local/compose.yaml stop
